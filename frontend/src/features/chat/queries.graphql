fragment ChatParticipantFields on ChatParticipantType {
  id
  name
  email
  department
  avatarUrl
  online
  lastSeenAt
}

fragment ChatMessageFields on ChatMessageType {
  id
  conversationId
  body
  createdAt
  mine
  sender {
    ...ChatParticipantFields
  }
  attachments {
    id
    url
    width
    height
  }
}

query ChatContacts($search: String, $limit: Int) {
  chatContacts(search: $search, limit: $limit) {
    id
    conversationId
    unreadCount
    lastMessagePreview
    lastMessageAt
    participant {
      ...ChatParticipantFields
    }
  }
}

query ChatMessages($conversationId: ID!, $limit: Int) {
  chatMessages(conversationId: $conversationId, limit: $limit) {
    ...ChatMessageFields
  }
}

mutation SendChatMessage(
  $body: String
  $conversationId: ID
  $recipientId: ID
  $photos: [String!]
) {
  sendChatMessage(
    body: $body
    conversationId: $conversationId
    recipientId: $recipientId
    photos: $photos
  ) {
    ...ChatMessageFields
  }
}

mutation StartChatCall($recipientId: ID!, $video: Boolean!) {
  startChatCall(recipientId: $recipientId, video: $video) {
    joinUrl
  }
}

mutation OpenChatConversation($recipientId: ID!) {
  openChatConversation(recipientId: $recipientId) {
    conversationId
  }
}

mutation MarkChatRead($conversationId: ID!) {
  markChatRead(conversationId: $conversationId) {
    conversationId
  }
}

mutation SetChatTyping($conversationId: ID!, $typing: Boolean!) {
  setChatTyping(conversationId: $conversationId, typing: $typing)
}

subscription ChatMessageReceived($conversationId: ID!) {
  chatMessageReceived(conversationId: $conversationId) {
    ...ChatMessageFields
  }
}

subscription ChatContactUpdated {
  chatContactUpdated {
    id
    conversationId
    unreadCount
    lastMessagePreview
    lastMessageAt
    participant {
      ...ChatParticipantFields
    }
  }
}

subscription ChatPresenceChanged {
  chatPresenceChanged {
    userId
    online
  }
}

subscription ChatTypingChanged($conversationId: ID!) {
  chatTypingChanged(conversationId: $conversationId) {
    userId
    typing
  }
}
