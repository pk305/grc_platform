query GlobalSearch($query: String!, $limit: Int) {
  globalSearch(query: $query, limit: $limit) {
    id
    kind
    label
    sublabel
    url
  }
}

query Notifications {
  notifications {
    key
    tone
    title
    detail
    href
  }
}

mutation ClearNotification($key: String!) {
  clearNotification(key: $key) {
    key
    tone
    title
    detail
    href
  }
}

mutation ClearAllNotifications {
  clearAllNotifications {
    key
    tone
    title
    detail
    href
  }
}
