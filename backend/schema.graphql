directive @oneOf on INPUT_OBJECT

directive @requireRoles repeatable on FIELD_DEFINITION

type AccessSummary {
  activeUsersCount: Int!
  deactivatedUsersCount: Int!
  ssoUsersCount: Int!
  successfulSignIns24h: Int!
  signInFailures24h: Int!
}

input AssignRoleInput {
  userId: ID!
  roleName: String!
}

union AssignRolePayload = UserType | RoleError | OperationInfo

type AuditEventType {
  id: String!
  eventType: String!
  actor: String!
  detail: String!
  createdAt: DateTime!
}

type AuditSummary {
  openFindingsCount: Int!
  overdueCorrectiveActionsCount: Int!
}

type AuthError {
  message: String!
}

union CreateRiskPayload = RiskType | OperationInfo

union CreateUserPayload = UserType | OperationInfo

"""Date (isoformat)"""
scalar Date

"""Date with time (isoformat)"""
scalar DateTime

union DeleteUserPayload = UserType | OperationInfo

"""permission | action"""
enum IamPermissionActionEnum {
  """View"""
  view

  """Create"""
  create

  """Edit"""
  edit

  """Delete"""
  delete

  """Approve"""
  approve

  """Assign"""
  assign
}

"""permission | resource"""
enum IamPermissionResourceEnum {
  """Users"""
  iam_users

  """Roles"""
  iam_roles

  """Risk register"""
  risk

  """Controls"""
  controls

  """Audit findings"""
  audit

  """Incidents"""
  incidents

  """Obligations"""
  obligations
}

"""role | name"""
enum IamRoleNameEnum {
  """Admin"""
  admin

  """CISO"""
  ciso

  """Risk Manager"""
  risk_manager

  """Auditor"""
  auditor

  """Control Owner"""
  control_owner

  """Viewer"""
  viewer
}

input IamRoleNameEnumFilterLookup {
  """Exact match. Filter will be skipped on `null` value"""
  exact: IamRoleNameEnum

  """Assignment test. Filter will be skipped on `null` value"""
  isNull: Boolean

  """
  Exact match of items in a given list. Filter will be skipped on `null` value
  """
  inList: [IamRoleNameEnum!]

  """Case-insensitive exact match. Filter will be skipped on `null` value"""
  iExact: IamRoleNameEnum

  """
  Case-sensitive containment test. Filter will be skipped on `null` value
  """
  contains: IamRoleNameEnum

  """
  Case-insensitive containment test. Filter will be skipped on `null` value
  """
  iContains: IamRoleNameEnum

  """Case-sensitive starts-with. Filter will be skipped on `null` value"""
  startsWith: IamRoleNameEnum

  """Case-insensitive starts-with. Filter will be skipped on `null` value"""
  iStartsWith: IamRoleNameEnum

  """Case-sensitive ends-with. Filter will be skipped on `null` value"""
  endsWith: IamRoleNameEnum

  """Case-insensitive ends-with. Filter will be skipped on `null` value"""
  iEndsWith: IamRoleNameEnum

  """
  Case-sensitive regular expression match. Filter will be skipped on `null` value
  """
  regex: IamRoleNameEnum

  """
  Case-insensitive regular expression match. Filter will be skipped on `null` value
  """
  iRegex: IamRoleNameEnum
}

"""user | auth provider"""
enum IamUserAuthProviderEnum {
  """Local"""
  local

  """Microsoft Entra ID"""
  entra_id
}

type IncidentSummary {
  openCount: Int!
}

union LoginResult = UserType | AuthError

type Mutation {
  login(email: String!, password: String!): LoginResult!
  logout: Boolean!
  requestPasswordReset(email: String!): Boolean!
  resetPassword(uid: String!, token: String!, newPassword: String!): ResetPasswordPayload!
  createUser(data: UserCreateInput!): CreateUserPayload! @requireRoles
  setUserActive(userId: ID!, isActive: Boolean!): SetUserActivePayload! @requireRoles
  deleteUser(userId: ID!): DeleteUserPayload! @requireRoles
  assignRole(data: AssignRoleInput!): AssignRolePayload! @requireRoles
  startAccessReview(userIds: [ID!]!): [UserType!]! @requireRoles
  revokeRole(data: AssignRoleInput!): RevokeRolePayload! @requireRoles
  createRisk(data: RiskCreateInput!): CreateRiskPayload! @requireRoles
}

type ObligationSummary {
  registeredCount: Int!
  reviewsDueSoonCount: Int!
}

input OffsetPaginationInput {
  offset: Int! = 0
  limit: Int
}

type OperationInfo {
  """List of messages returned by the operation."""
  messages: [OperationMessage!]!
}

type OperationMessage {
  """The kind of this message."""
  kind: OperationMessageKind!

  """The error message."""
  message: String!

  """
  The field that caused the error, or `null` if it isn't associated with any particular field.
  """
  field: String

  """The error code, or `null` if no error code was set."""
  code: String
}

enum OperationMessageKind {
  INFO
  WARNING
  ERROR
  PERMISSION
  VALIDATION
}

enum Ordering {
  ASC
  ASC_NULLS_FIRST
  ASC_NULLS_LAST
  DESC
  DESC_NULLS_FIRST
  DESC_NULLS_LAST
}

input PermissionOrder @oneOf {
  resource: Ordering
  action: Ordering
}

"""
Resource/action grants held by roles — the access-control catalog (A.5.15).
"""
type PermissionType {
  roles: [RoleType!]!
  id: ID!
  resource: IamPermissionResourceEnum!
  action: IamPermissionActionEnum!
  isoClause: String!
}

type Query {
  users(filters: UserFilter, order: UserOrder, pagination: OffsetPaginationInput): [UserType!]!
  roles(filters: RoleFilter, order: RoleOrder): [RoleType!]!
  permissions(order: PermissionOrder): [PermissionType!]!
  me: UserType
  auditEvents(limit: Int! = 50): [AuditEventType!]!
  accessSummary: AccessSummary!
  risks(order: RiskOrder): [RiskType!]!
  riskSummary: RiskSummary!
  soaSummary: SoaSummary!
  auditSummary: AuditSummary!
  incidentSummary: IncidentSummary!
  obligationSummary: ObligationSummary!
}

union ResetPasswordPayload = UserType | OperationInfo

union RevokeRolePayload = UserType | RoleError | OperationInfo

input RiskCreateInput {
  title: String!
  inherentLikelihood: Int!
  inherentImpact: Int!
  description: String! = ""
  source: String! = ""
  event: String! = ""
  consequence: String! = ""
  ownerId: ID = null
  nextReviewDate: Date = null
}

type RiskLevelCount {
  level: String!
