"""Application user. Email is the login identifier."""
input UserFilter {
  email: StrFilterLookup
  lastName: StrFilterLookup
  AND: UserFilter
  OR: UserFilter
  NOT: UserFilter
  DISTINCT: Boolean
}

input UserOrder @oneOf {
  email: Ordering
  lastName: Ordering
}

"""Application user. Email is the login identifier."""
type UserType {
  roles: [RoleType!]!
  id: ID!
  lastLogin: DateTime

  """
  Designates that this user has all permissions without explicitly assigning them.
  """
  isSuperuser: Boolean!

  """Required. 150 characters or fewer. Letters, digits and @/./+/-/_ only."""
  username: String!
  firstName: String!
  lastName: String!

  """
  Designates whether this user should be treated as active. Unselect this instead of deleting accounts.
  """
  isActive: Boolean!
  dateJoined: DateTime!
  email: String!
  authProvider: IamUserAuthProviderEnum!
  entraObjectId: String
  department: String!
  mfaEnabled: Boolean!
  nextAccessReviewDate: Date
}